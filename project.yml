name: moniq
options:
  bundleIdPrefix: com.moniq
  deploymentTarget:
    macOS: "13.0"
  xcodeVersion: "15.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: 5.9
    MACOSX_DEPLOYMENT_TARGET: 13.0
    MARKETING_VERSION: 1.0.0
    CURRENT_PROJECT_VERSION: 1
    PRODUCT_BUNDLE_IDENTIFIER: com.moniq.app
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""
    ENABLE_HARDENED_RUNTIME: YES
    OTHER_SWIFT_FLAGS: ""

targets:
  moniq:
    type: application
    platform: macOS
    deploymentTarget: "13.0"
    sources:
      - path: App
      - path: Core
      - path: ViewModels
      - path: Views
      - path: Utilities
      - path: ContentView.swift
    settings:
      base:
        PRODUCT_NAME: moniq
        INFOPLIST_FILE: moniq/Info.plist
        CODE_SIGN_ENTITLEMENTS: moniq/moniq.entitlements
        SWIFT_OPTIMIZATION_LEVEL: "-Onone"
    dependencies:
      - sdk: IOKit.framework
      - sdk: CoreFoundation.framework
      - sdk: Network.framework
    info:
      path: moniq/Info.plist
      properties:
        CFBundleName: moniq
        CFBundleDisplayName: moniq
        CFBundleIdentifier: com.moniq.app
        CFBundleVersion: "1"
        CFBundleShortVersionString: "1.0.0"
        LSMinimumSystemVersion: "13.0"
        NSHumanReadableCopyright: "© 2026 moniq"
        LSUIElement: false
        NSSupportsAutomaticTermination: false
        NSPrincipalClass: NSApplication
        NSMainNibFile: ""
        CFBundleIconFile: AppIcon
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: false
